<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Stream</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh;padding-bottom:100px}
.container{max-width:800px;margin:0 auto;padding:16px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.header h1{font-size:22px;font-weight:700;background:linear-gradient(135deg,#f0883e,#bc8cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.add-toggle{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
.add-toggle:hover{border-color:#f0883e;color:#f0f6fc}
.add-form{display:none;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.add-form.show{display:flex}
.add-form input{flex:1;min-width:140px;padding:8px 12px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#c9d1d9;font-size:13px;outline:none}
.add-form input:focus{border-color:#f0883e}
.add-form button{padding:8px 16px;border-radius:8px;border:none;background:#f0883e;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.add-form button:hover{background:#d97706}
.search-bar{margin-bottom:16px}
.search-bar input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid #30363d;background:#161b22;color:#c9d1d9;font-size:13px;outline:none;transition:border-color .15s}
.search-bar input:focus{border-color:#f0883e}
.city-section{margin-bottom:4px;border:1px solid #21262d;border-radius:12px;overflow:hidden}
.city-section:has(.city-body.open){border-color:#30363d}
.city-header{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#f0f6fc;padding:10px 12px;cursor:pointer;transition:background .15s;user-select:none}
.city-header:hover{background:#1c2333}
.city-header .icon{font-size:16px}
.city-header .count{font-size:12px;color:#484f58;font-weight:400}
.city-header .arrow{font-size:12px;color:#484f58;margin-left:auto;transition:transform .2s}
.city-header .arrow.open{transform:rotate(180deg)}
.city-body{display:none;padding:4px 4px 8px}
.city-body.open{display:block}
.station-card{display:flex;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer;transition:all .12s;gap:10px}
.station-card:hover{background:#1c2333}
.station-card.active{background:#1a2e1a}
.station-card .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:background .3s}
.station-card .status-dot.unknown{background:#30363d}
.station-card .status-dot.active{background:#3fb950;box-shadow:0 0 6px #3fb950}
.station-card .status-dot.inactive{background:#da3633}
.station-card .status-dot.checking{background:#d29922;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.station-card .info{flex:1;min-width:0}
.station-card .name{font-size:14px;font-weight:500;color:#f0f6fc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.station-card .sub{font-size:11px;color:#8b949e;margin-top:2px}
.station-card .actions{display:flex;gap:2px;flex-shrink:0}
.station-card .actions button{background:none;border:none;color:#484f58;cursor:pointer;font-size:15px;padding:2px 4px;border-radius:4px;line-height:1;visibility:hidden}
.station-card:hover .actions button{visibility:visible}
.station-card .actions .edit:hover{color:#58a6ff;background:#1c2333}
.station-card .actions .remove:hover{color:#f85149;background:#2d1b1b}
.empty{color:#8b949e;text-align:center;padding:40px;font-size:13px}
.footer{text-align:center;padding:24px 16px 8px;font-size:12px;color:#484f58}
.footer a{color:#484f58;text-decoration:none}
.footer a:hover{color:#58a6ff}

/* Bottom player */
.bottom-player{position:fixed;bottom:0;left:0;right:0;background:#161b22;border-top:1px solid #30363d;padding:10px 16px;z-index:100;display:flex;align-items:center;gap:10px}
.bottom-player .logo{width:36px;height:36px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;overflow:hidden;background:#21262d}
.bottom-player .logo img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.bottom-player .info{flex:1;min-width:0}
.bottom-player .name{font-size:13px;font-weight:600;color:#f0f6fc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bottom-player .meta{font-size:11px;color:#8b949e;margin-top:1px}
.bottom-player .ctrl{display:flex;align-items:center;gap:6px}
.bottom-player .ctrl button{background:none;border:none;color:#c9d1d9;cursor:pointer;font-size:20px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .15s}
.bottom-player .ctrl button:hover{background:#30363d;color:#f0f6fc}
.bottom-player .ctrl button.playing{color:#3fb950}
.bottom-player audio{width:120px;height:28px}
.bottom-player input[type=range]{width:60px;height:4px;-webkit-appearance:none;appearance:none;background:#30363d;border-radius:2px;outline:none;cursor:pointer}
.bottom-player input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#f0883e;border:none;cursor:pointer}
@media(max-width:500px){
.bottom-player{flex-wrap:wrap;padding:8px 10px;gap:6px}
.bottom-player audio{width:80px;height:24px}
.bottom-player input[type=range]{width:40px}
.bottom-player .info{width:auto;flex:1;min-width:60px}
.container{padding:10px}
}
</style>
</head>

{name:"Slow Radio",url:"https://stream.zeno.fm/dpk2zq5np2zuv",city:"Nasional"},
{name:"Golden Memories",url:"https://stream.zeno.fm/xg7mcgf1bf9uv",city:"Nasional"},
{name:"Rock Rewind",url:"https://stream.zenolive.com/u18tuaphwzzuv.aac",city:"Nasional"},
{name:"Big 90's",url:"https://stream.zeno.fm/qmqe8k5e74zuv",city:"Nasional"},
{name:"Rock Ballads",url:"https://stream.zeno.fm/ynepvmy14bhvv",city:"Nasional"},
];

const cityEmoji={
"Jakarta":"\u{1F4CD}","Bandung":"\u{26E9}","Surabaya":"\u{1F30A}","Yogyakarta":"\u{1F3F0}",
"Semarang":"\u{1F332}","Surakarta":"\u{1F3E0}","Cirebon":"\u{1F3ED}","Salatiga":"\u{26EA}",
"Pati":"\u{1F3E1}","Medan":"\u{1F3D8}","Makassar":"\u{1F304}","Bali":"\u{1F334}",
"Banjarmasin":"\u{26F5}","Palembang":"\u{1F33B}","Samarinda":"\u{1F333}","Balikpapan":"\u{1F4A7}",
"Kediri":"\u{1F341}","Bogor":"\u{26FA}","Banda Aceh":"\u{1F3F0}","Nasional":"\u{1F30D}",
"Batam":"\u{1F6EB}","Padang":"\u{1F3D4}","Manado":"\u{1F30A}","Wonosobo":"\u{26F0}",
"Malang":"\u{1F340}","Blitar":"\u{1F341}","Lombok":"\u{1F3DE}","Tuban":"\u{26F5}",
"Kulonprogo":"\u{26F0}","Trenggalek":"\u{26F0}","Manokwari":"\u{1F334}","Jambi":"\u{1F33B}",
"Bumiayu":"\u{26E9}","Batulicin":"\u{1F4A7}","Lainnya":"\u{1F30D}"
};

let customStations=[];
let currentStation=null;
let searchQuery='';
let isPlaying=false;
const statusMap=new Map();
const expandedCities=new Set();

const player=document.getElementById('player');
const bottomTitle=document.getElementById('bottomTitle');
const bottomMeta=document.getElementById('bottomMeta');
const playBtn=document.getElementById('playBtn');
const playerLogo=document.getElementById('playerLogo');
const volSlider=document.getElementById('volSlider');

function getAll(){return[...stations,...customStations]}

function getCities(){
const cities=new Map();
getAll().forEach(s=>{
if(!cities.has(s.city))cities.set(s.city,[]);
cities.get(s.city).push(s);
});
const order=["Jakarta","Bandung","Surabaya","Yogyakarta","Semarang","Surakarta","Cirebon","Salatiga","Pati","Medan","Makassar","Batam","Padang","Bali","Banjarmasin","Palembang","Banda Aceh","Samarinda","Balikpapan","Kediri","Bogor","Manado","Wonosobo","Malang","Blitar","Lombok","Tuban","Kulonprogo","Trenggalek","Manokwari","Jambi","Bumiayu","Batulicin","Nasional","Lainnya"];
return [...cities.entries()].sort((a,b)=>{
const ia=order.indexOf(a[0]);const ib=order.indexOf(b[0]);
if(ia>=0&&ib>=0)return ia-ib;
if(ia>=0)return -1;if(ib>=0)return 1;
return a[0].localeCompare(b[0]);
});
}

function filtered(){
let list=getAll();
if(searchQuery){const q=searchQuery.toLowerCase();list=list.filter(s=>s.name.toLowerCase().includes(q)||s.city.toLowerCase().includes(q))}
return list;
}

function checkStation(s){
const key=s.url;
if(statusMap.has(key)&&statusMap.get(key)!=='unknown')return;
statusMap.set(key,'checking');
renderStations();
const c=new AbortController();
setTimeout(()=>c.abort(),5000);
fetch(s.url,{mode:'no-cors',signal:c.signal,method:'HEAD'})
.then(()=>{statusMap.set(key,'active');renderStations()})
.catch(()=>{statusMap.set(key,'inactive');renderStations()});
}

function checkAllStations(){
const all=getAll();
all.forEach(s=>{statusMap.set(s.url,'unknown')});
let i=0;
function next(){
if(i>=all.length)return;
const s=all[i++];const key=s.url;
statusMap.set(key,'checking');
const c=new AbortController();
setTimeout(()=>c.abort(),5000);
fetch(s.url,{mode:'no-cors',signal:c.signal,method:'HEAD'})
.then(()=>{statusMap.set(key,'active')})
.catch(()=>{statusMap.set(key,'inactive')})
.finally(()=>{renderStations();next()});
}
for(let n=0;n<4;n++)next();
}

function renderStations(){
const c=document.getElementById('stationsContainer');
const cities=getCities();
let html='',has=false;
cities.forEach(([city,list])=>{
const flist=filtered().filter(s=>s.city===city).sort((a,b)=>a.name.localeCompare(b.name));
if(!flist.length)return;
has=true;
const icon=cityEmoji[city]||'\u{1F4CD}';
const open=expandedCities.has(city);
html+=`<div class="city-section"><div class="city-header" data-city="${city}"><span class="icon">${icon}</span>${city}<span class="count">${flist.length}</span><span class="arrow${open?' open':''}">\u25BC</span></div><div class="city-body${open?' open':''}">`;
flist.forEach(s=>{
const isCustom=customStations.includes(s);
const active=currentStation===s;
const st=statusMap.get(s.url)||'unknown';
html+=`<div class="station-card${active?' active':''}" data-u="${s.url}" data-n="${s.name}" data-c="${s.city}">
<div class="status-dot ${st}" title="${st==='active'?'Online':st==='inactive'?'Offline':'Memeriksa...'}"></div>
<div class="info"><div class="name">${s.name}</div><div class="sub">${s.city}${isCustom?'  \u2022 Kustom':''}</div></div>
<div class="actions">
<button class="edit" data-i="${isCustom?customStations.indexOf(s):stations.indexOf(s)}" data-type="${isCustom?'custom':'builtin'}">\u270E</button>
${isCustom?`<button class="remove" data-i="${customStations.indexOf(s)}">&times;</button>`:''}
</div>
</div>`;
});
html+=`</div></div>`;
});
c.innerHTML=has?html:'<div class="empty">Tidak ada stasiun ditemukan</div>';
c.querySelectorAll('.station-card').forEach(el=>{el.onclick=function(e){if(e.target.closest('.actions'))return;playStation({url:this.dataset.u,name:this.dataset.n,city:this.dataset.c})}});
c.querySelectorAll('.city-header').forEach(el=>{el.onclick=function(){const city=this.dataset.city;const body=this.nextElementSibling;body.classList.toggle('open');this.querySelector('.arrow').classList.toggle('open');if(body.classList.contains('open'))expandedCities.add(city);else expandedCities.delete(city)}});
c.querySelectorAll('.edit').forEach(el=>{el.onclick=function(e){e.stopPropagation();const i=parseInt(this.dataset.i);const type=this.dataset.type;const s=type==='builtin'?stations[i]:customStations[i];document.getElementById('urlInput').value=s.url;document.getElementById('nameInput').value=s.name;document.getElementById('cityInput').value=s.city;document.getElementById('addForm').classList.add('show');document.getElementById('addBtn').textContent='Simpan';document.getElementById('addBtn').dataset.editIndex=i;document.getElementById('addBtn').dataset.editType=type}});
c.querySelectorAll('.remove').forEach(el=>{el.onclick=function(e){e.stopPropagation();const i=parseInt(this.dataset.i);const s=customStations[i];customStations.splice(i,1);save();renderStations();if(currentStation===s){player.pause();currentStation=null;updateBottom()}}});
}

function playStation(s){
currentStation=s;
player.src=s.url;
player.play().catch(()=>{statusMap.set(s.url,'inactive');renderStations()});
updateBottom();
renderStations();
}

function updateBottom(){
if(currentStation){
bottomTitle.textContent=currentStation.name;
bottomMeta.textContent=currentStation.city;
playBtn.innerHTML=isPlaying?'\u{23F8}\u{FE0F}':'\u25B6';
playBtn.className=isPlaying?'playing':'';
const initial=currentStation.name.charAt(0).toUpperCase();
const ci=currentStation.name.split('').reduce((a,c)=>a+c.charCodeAt(0),0)%colors.length;
const domain=currentStation.url.replace(/https?:\/\//,'').split('/')[0].split(':')[0];
playerLogo.style.background=colors[ci];
playerLogo.innerHTML=`<img src="https://www.google.com/s2/favicons?domain=${domain}&sz=40" alt="" onerror="this.style.display='none';this.parentElement.textContent='${initial}'" loading="lazy">`;
}else{
bottomTitle.textContent='Pilih radio';
bottomMeta.textContent='';
playBtn.innerHTML='\u25B6';
playBtn.className='';
playerLogo.style.background='#21262d';
playerLogo.textContent='';
}
}

function save(){localStorage.setItem('radioCustom',JSON.stringify(customStations))}
function load(){try{const d=localStorage.getItem('radioCustom');if(d)customStations=JSON.parse(d)}catch(e){}}

document.getElementById('addToggle').onclick=()=>{const f=document.getElementById('addForm');f.classList.toggle('show');if(!f.classList.contains('show')){document.getElementById('addBtn').textContent='Tambah';delete document.getElementById('addBtn').dataset.editIndex;delete document.getElementById('addBtn').dataset.editType;document.getElementById('urlInput').value='';document.getElementById('nameInput').value='';document.getElementById('cityInput').value=''}};
document.getElementById('addBtn').onclick=()=>{
const btn=document.getElementById('addBtn');
const url=document.getElementById('urlInput').value.trim();
const name=document.getElementById('nameInput').value.trim()||'Radio Baru';
const city=document.getElementById('cityInput').value.trim()||'Kustom';
if(!url){alert('Masukkan URL');return}
const editIndex=btn.dataset.editIndex;
const editType=btn.dataset.editType;
if(editIndex!==undefined&&editType==='builtin'){
stations[editIndex]={name,url,city};
statusMap.set(url,'unknown');
}else if(editIndex!==undefined){
customStations[editIndex]={name,url,city};
statusMap.set(url,'unknown');
}else{
customStations.push({name,url,city});
statusMap.set(url,'unknown');
}
save();
document.getElementById('urlInput').value='';
document.getElementById('nameInput').value='';
document.getElementById('cityInput').value='';
btn.textContent='Tambah';
delete btn.dataset.editIndex;
delete btn.dataset.editType;
document.getElementById('addForm').classList.remove('show');
renderStations();
if(editIndex===undefined)checkStation(customStations[customStations.length-1]);
};
document.getElementById('searchInput').oninput=function(){searchQuery=this.value;if(searchQuery){getCities().forEach(([city])=>expandedCities.add(city))}renderStations()};
playBtn.onclick=()=>{if(!currentStation)return;if(player.paused){player.play()}else{player.pause()}};
player.onplay=()=>{isPlaying=true;updateBottom()};
player.onpause=()=>{isPlaying=false;updateBottom()};
player.onerror=()=>{if(currentStation){statusMap.set(currentStation.url,'inactive');renderStations()}bottomMeta.textContent='Gagal memuat stream';isPlaying=false;updateBottom()};
volSlider.oninput=function(){player.volume=parseFloat(this.value)};
player.volume=0.8;

load();renderStations();updateBottom();checkAllStations();
</script>
</body>
</html>
